.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
.scan{animation:scan 6s ease-in-out infinite}@keyframes scan{0%{transform:translateY(-60px);opacity:0}15%,80%{opacity:1}100%{transform:translateY(340px);opacity:0}}
@media (prefers-reduced-motion:reduce){.arm,.flow,.pulse,.scan{animation:none}.scan{display:none}}
</style>
